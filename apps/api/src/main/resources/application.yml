spring:
  application:
    name: campus-shop-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campus_shop}
    username: ${DB_USERNAME:campus}
    password: ${DB_PASSWORD:campus123}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  # Honor X-Forwarded-* headers when the API sits behind a reverse proxy.
  forward-headers-strategy: framework

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Comma-separated exact origins. Do not include a path or trailing slash.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
    # Optional wildcard patterns, for example https://*.github.io.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
    max-age: ${CORS_MAX_AGE:3600}
