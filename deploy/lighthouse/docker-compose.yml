name: campus-shop

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campus_shop
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_shop"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - app

  api:
    image: eclipse-temurin:21-jre
    working_dir: /app
    command: ["java", "-XX:MaxRAMPercentage=70", "-jar", "/app/app.jar"]
    volumes:
      - ./app.jar:/app/app.jar:ro
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/campus_shop
      DB_USERNAME: campus
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  caddy:
    image: caddy:2.11-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app

volumes:
  # Keep ACME account/certificate state between deployments. PostgreSQL intentionally
  # has no volume: recreating the stack resets the demo data.
  caddy_data:
  caddy_config:

networks:
  app:
