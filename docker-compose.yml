name: campus-shop

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-shop-db
    environment:
      POSTGRES_DB: campus_shop
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - campus_shop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_shop"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  campus_shop_data:
